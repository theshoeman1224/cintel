[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-c-code-intelligence"
version = "0.1.0"
description = "Offline-first, build-aware intelligence for legacy C repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Legacy C Code Intelligence contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
cintel = "cintel.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
# Matches sonar.sources: the package plus the helper scripts, which the
# suite exercises (install.py, fixtures.py).
source = ["src/cintel", "scripts"]
relative_files = true
data_file = ".coverage"

[tool.coverage.report]
show_missing = true
precision = 1

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/cintel"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

