[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-c-code-intelligence"
version = "0.1.0"
description = "Offline-first, build-aware intelligence for legacy C repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Legacy C Code Intelligence contributors"}]
dependencies = []

[project.scripts]
cintel = "cintel.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"

